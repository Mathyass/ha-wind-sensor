esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  min_version: 2026.9.0
  project:
    name: mathyass.ha-wind-sensor
    version: ${firmware_version}

esp32:
  board: seeed_xiao_esp32s3
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

# Native USB-C on XIAO; Improv uses the same port as the logger.
logger:
  hardware_uart: USB_SERIAL_JTAG
  baud_rate: 115200

api:
  # Stay available for provisioning/testing even when HA is not connected.
  reboot_timeout: 0s

mdns:

ota:
  - platform: esphome
    id: ota_esphome
  - platform: http_request
    id: ota_http_request

# Public release checks use GitHub Pages directly to avoid release redirects.
http_request:
  verify_ssl: true
  timeout: 10s

update:
  - platform: http_request
    id: firmware_update
    name: Firmware Update
    source: ${update_manifest_url}
    entity_category: config
    update_interval: 6h

wifi:
  # Credentials are provisioned by the owner and stored on the device.
  ap:
    ap_timeout: 1min

captive_portal:

improv_serial:
  next_url: https://mathyass.github.io/ha-wind-sensor/?device_name={{device_name}}&ip_address={{ip_address}}

# Allows ESPHome Device Builder to offer "Take control" after publication.
dashboard_import:
  package_import_url: github://Mathyass/ha-wind-sensor/esphome/wind-sensor.yaml@main
  import_full_config: false

sensor:
  - platform: pulse_meter
    id: wind_speed
    name: Wind Speed
    pin:
      number: GPIO4 # XIAO pin D3, not D4
      mode:
        input: true
        pullup: true
    internal_filter: 5ms
    internal_filter_mode: EDGE
    timeout: 5s
    unit_of_measurement: km/h
    accuracy_decimals: 1
    device_class: wind_speed
    state_class: measurement
    filters:
      # pulse_meter outputs pulses/min: 2.4 / 60 = 0.04.
      - multiply: 0.04
