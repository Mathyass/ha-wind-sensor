name: Build and release firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: test "$TAG" = "v$(cat VERSION)"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libusb-1.0-0
          python -m pip install -r requirements.txt
      - name: Validate, compile and package
        run: python scripts/build.py
      - name: Check packaged files
        working-directory: dist/installer
        run: sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ha-wind-sensor-installer
          path: dist/ha-wind-sensor-*-installer.zip
          if-no-files-found: error
          retention-days: 30
      - name: Prepare public installer for GitHub Pages
        if: github.event.repository.visibility == 'public' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/installer

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ha-wind-sensor-installer
          path: artifacts
      - name: Publish firmware release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.zip --clobber
          else
            if [[ "$TAG" == *-* ]]; then
              gh release create "$TAG" artifacts/*.zip --verify-tag --prerelease \
                --title "HA Wind Sensor $TAG" \
                --notes "Test firmware for XIAO ESP32-S3. English is the default language; Czech is available as an alternative. Physical hardware testing is still required."
            else
              gh release create "$TAG" artifacts/*.zip --verify-tag --latest \
                --title "HA Wind Sensor $TAG" \
                --generate-notes
            fi
          fi

  pages:
    if: github.event.repository.visibility == 'public' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: [build, release]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public installer
        id: deployment
        uses: actions/deploy-pages@v4
